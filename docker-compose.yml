version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vsks_crm
      POSTGRES_USER: vsks
      POSTGRES_PASSWORD: vsks_secret_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsks -d vsks_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vsks:vsks_secret_2024@db:5432/vsks_crm
      SECRET_KEY: vsks-jwt-secret-key-change-in-production
      SUBSIDY_LIMIT: "26128070"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:

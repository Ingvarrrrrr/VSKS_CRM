<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Android: env(safe-area-inset-top)=0, а viewport-fit=cover рисует окно под статус-баром — отключаем cover
      if (/Android/i.test(navigator.userAgent)) {
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0');
      }
    </script>
    <title>GALA — Управление закупками</title>

    <!-- PWA -->
    <meta name="theme-color" content="#fb923c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GALA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0e0c'/%3E%3Cpath d='M22 6 L8 6 L8 26 L22 26 L22 17 L15 17' stroke='%23fb923c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />

    <!-- M5: брендовый фон под status-bar и до загрузки Vue — убирает белую вспышку
         при запуске PWA на iOS/Android. Сразу учитываем выбранную тему и старт
         визуальной сборки при медленной загрузке бандла (Swarm Rebuild). -->
    <script>
      window.__galaBootStart = Date.now();
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('gala-boot-dark');
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background-color: #f5f3ef; }
      html.gala-boot-dark, html.gala-boot-dark body { background-color: #0f0e0c; }
      #app:empty::after {
        content: '';
        position: fixed; inset: 0;
        background: #f5f3ef url("/pwa-192x192.png") center / 64px no-repeat;
        opacity: 0.9;
      }
      html.gala-boot-dark #app:empty::after {
        background-color: #0f0e0c;
      }
      #gala-boot-swarm {
        position: fixed; inset: 0; z-index: 9400; pointer-events: none;
        background-color: #f5f3ef;
        background-image:
          linear-gradient(to right, rgba(90, 84, 72, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(90, 84, 72, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #1c1916;
      }
      html.gala-boot-dark #gala-boot-swarm {
        background-color: #0f0e0c; color: #f1f5f9;
        background-image:
          linear-gradient(to right, rgba(240, 236, 228, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(240, 236, 228, 0.05) 1px, transparent 1px);
      }
      .gbs-box {
        position: absolute; border: 1px dashed rgba(194, 98, 10, 0.5);
        border-radius: 10px; background: rgba(255, 255, 255, 0.55);
        animation: gbs-grow 0.55s cubic-bezier(.22,.9,.32,1) both;
      }
      html.gala-boot-dark .gbs-box {
        border-color: rgba(251, 146, 60, 0.5); background: rgba(28, 25, 22, 0.65);
      }
      .gbs-cur {
        position: absolute; padding: 2px 8px; border-radius: 999px; font-size: 11px;
        font-weight: 600; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        transition: transform 0.65s ease;
      }
      @keyframes gbs-grow { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
    </style>

    <!-- Локальные шрифты (офлайн): объявлены через @font-face в src/styles/gala.css, файлы в public/fonts/.
         Preload основных начертаний, чтобы не было FOUT при старте. -->
    <link rel="preload" href="/fonts/syne-v24-latin-800.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/inter-tight-v9-latin-regular.ttf" as="font" type="font/ttf" crossorigin>

    <!-- Phase 26-FFF: one-time SW + cache cleanup для пользователей со старым bundle.
         Срабатывает максимум 1 раз (флаг в localStorage). Помогает тем кто впервые
         получил свежий index.html (после убирания html из precache в vite.config). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('phase29_3_R3_2026_05_26') === '1') return;
          if (!('serviceWorker' in navigator) || !('caches' in window)) {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            return;
          }
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }),
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          ]).then(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            window.location.reload();
          }).catch(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
          });
        } catch (e) {
          try { localStorage.setItem('phase29_3_R3_2026_05_26', '1'); } catch (_) { /* noop */ }
        }
      })();
    </script>

    <!-- Self-heal: если закэшированный index.html ссылается на удалённый JS/CSS-чанк
         (404 → белый экран), ловим ошибку загрузки ассета, чистим SW+кэши и
         перезагружаемся ОДИН раз за сессию (guard от цикла, окно 30с). В отличие
         от one-time флага выше — срабатывает на КАЖДЫЙ будущий устаревший билд. -->
    <script>
      (function () {
        function isAssetFail(t) {
          if (!t) return false;
          var src = t.src || t.href || '';
          return (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && src.indexOf('/assets/') !== -1;
        }
        window.addEventListener('error', function (e) {
          if (!isAssetFail(e.target)) return;
          try {
            var last = +(sessionStorage.getItem('gala_chunk_reload_ts') || 0);
            if (Date.now() - last < 30000) return; // уже чинились недавно — не зацикливаемся
            sessionStorage.setItem('gala_chunk_reload_ts', String(Date.now()));
          } catch (_) { return; }
          var done = function () { window.location.reload(); };
          try {
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if ('caches' in window) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(done).catch(done);
          } catch (_) { done(); }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var stopped = false;
        var el = null;
        window.__galaStopBootSwarm = function () {
          stopped = true;
          if (el && el.parentNode) { el.parentNode.removeChild(el); el = null; }
        };
        try {
          if (localStorage.getItem('gala_auth') !== '1') return;
          var pub = ['/login', '/register', '/verify-email', '/reset-password', '/consent-required'];
          if (pub.indexOf(location.pathname) !== -1) return;
        } catch (_) { return; }
        setTimeout(function () {
          if (stopped) return;
          el = document.createElement('div');
          el.id = 'gala-boot-swarm';
          el.innerHTML =
            '<div style="position:absolute;top:16px;left:22px;font-weight:800;letter-spacing:.12em;font-size:18px">GA<span style="color:#fb923c">L</span>A</div>' +
            '<div class="gbs-box" style="left:4%;top:10%;width:92%;height:11%"></div>' +
            '<div class="gbs-box" style="left:4%;top:24%;width:29%;height:14%;animation-delay:.12s"></div>' +
            '<div class="gbs-box" style="left:35.5%;top:24%;width:29%;height:14%;animation-delay:.22s"></div>' +
            '<div class="gbs-box" style="left:67%;top:24%;width:29%;height:14%;animation-delay:.32s"></div>' +
            '<div class="gbs-box" style="left:4%;top:41%;width:92%;height:50%;animation-delay:.4s"></div>' +
            '<div class="gbs-cur" style="left:16%;top:14%;background:#c2620a">ФЭО</div>' +
            '<div class="gbs-cur" style="left:48%;top:29%;background:#2563eb">Закупки</div>' +
            '<div class="gbs-cur" style="left:72%;top:48%;background:#16a34a">Договоры</div>';
          document.body.appendChild(el);
          setTimeout(function () { if (!stopped) window.__galaStopBootSwarm(); }, 15000);
        }, 380);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

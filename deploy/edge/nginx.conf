# ═══════════════════════════════════════════════════════════════════════
# EDGE NGINX — единственный источник правил маршрутизации для ВСЕХ доменов
# сервера, кроме внутренней части самого GALA (та живёт в nginx/nginx.conf
# основного репозитория VSKS). Установлен на сервере в /opt/edge-nginx/ —
# ВНЕ git-дерева VSKS (deploy/install.sh копирует файлы сюда из репозитория
# при каждом запуске, см. install.sh). autodeploy.sh VSKS (git checkout -f +
# git clean -fd в /opt/vsks-crm) этот каталог НИКОГДА не трогает — они
# физически не пересекаются.
#
# ⚠️ ПРАВИТЬ ЭТОТ ФАЙЛ ЗДЕСЬ (в git), ПОТОМ deploy/edge/install.sh НА
# СЕРВЕРЕ — а не наоборот. Правка живого /opt/edge-nginx/nginx.conf на
# сервере без коммита в git потеряется при следующем install.sh.
#
# ПОЧЕМУ ЭТОТ ФАЙЛ СУЩЕСТВУЕТ (2026-09-05, решение владельца):
# До разреза ВЕСЬ конфиг nginx для ВСЕХ проектов на сервере (uniform,
# trading, sunduk, sizo, nemakh, halliem, n8n/adminer GALA) лежал В
# РЕПОЗИТОРИИ VSKS (nginx/nginx.conf) и пересобирался/перезагружался
# автодеплоем VSKS. Любая ошибка в PR VSKS теоретически рисковала положить
# порты 80/443 — то есть ВСЕ проекты на машине, не только VSKS. Разрез на
# два слоя устраняет этот риск структурно: edge (этот файл) владеет 80/443
# и TLS, меняется только вручную через install.sh, и НИКОГДА не трогается
# автодеплоем VSKS. GALA-nginx (nginx/nginx.conf в git VSKS) содержит ТОЛЬКО
# gaaala.duckdns.org, слушает внутренний 127.0.0.1:8079, автодеплой VSKS
# пересоздаёт/перегружает его сколько угодно — чужие домены физически не
# могут пострадать (кроме самого GALA, естественно — если он упал, отвечает
# 502 ТОЛЬКО gaaala, см. location / в блоке gaaala.duckdns.org ниже).
#
# СВЯЗЬ EDGE ↔ GALA (обоснование выбора, см. отчёт install.sh/README для
# полного текста): host.docker.internal:8079 — GALA публикует порт
# ТОЛЬКО на 127.0.0.1 хоста (docker-compose.yml VSKS, сервис nginx), а не
# в докер-сеть. Это тот же способ, каким этот файл уже достаёт
# uniform/sunduk/sizo/nemakh/trading/halliem (все они — независимые
# процессы/контейнеры на хостовых портах) — единообразно, edge не обязан
# знать ничего о внутренней докер-сети/именах сервисов VSKS, только порт.
# Раз GALA когда-нибудь целиком остановится/переедет — от edge требуется
# поменять только один порт в одном месте, а не разбираться с сетями.
#
# СВЯЗЬ EDGE ↔ n8n/adminer — ИНАЧЕ: они добавлены как compose-сервисы
# ВНУТРИ проекта VSKS изначально не как самостоятельные внешние процессы
# (в отличие от uniform/sunduk/итд), и adminer вообще не публикует хостовый
# порт (наружу его никогда не публиковали — правило №4). Заводить ради
# edge новый хостовый порт под adminer — лишняя поверхность (ещё один порт
# на хосте под сервис без своей авторизации, кроме basic-auth, который сам
# edge и подставляет). Вместо этого edge-nginx подключён ДОПОЛНИТЕЛЬНОЙ
# сетью к уже существующей `vsks-crm_default` (external: true, см.
# deploy/edge/docker-compose.yml) и резолвит их по имени сервиса (n8n,
# adminer) — Docker embedded DNS (127.0.0.11, resolver ниже) отдаёт актуальный
# IP при каждом реролве, устойчиво к пересозданию контейнеров VSKS.
# ═══════════════════════════════════════════════════════════════════════

events {}

http {
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Корректный Connection-заголовок при проксировании апгрейда до
    # websocket ЧЕРЕЗ ДВА ХОПА (edge → GALA → backend/frontend pool):
    # безусловный "upgrade" на обычных (не-websocket) запросах ломает
    # keep-alive промежуточного хопа. Используется только в новом
    # gaaala-блоке ниже — блоки соседей скопированы из старого общего
    # nginx.conf БЕЗ ИЗМЕНЕНИЙ (см. комментарии на каждом), включая их
    # исходный безусловный "upgrade" — не правим то, что уже работает и не
    # относится к разрезу.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ──────────────────────────────────────────────────────────────────
    # HTTP (порт 80) — редиректы на HTTPS для каждого домена + сохранённые
    # исключения (deploy-вебхуки по HTTP, GitHub исторически бил именно так
    # по голому IP; /.well-known — ACME HTTP-01 заглушка, реальный выпуск
    # идёт через DNS-01, см. scripts/setup-ssl.sh, но безвредно держать).
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # /deploy/* по HTTP — GitHub-вебхуки исторически били по голому IP.
        location /deploy/ {
            proxy_pass http://172.17.0.1:9000/deploy/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        location / { return 301 https://gaaala.duckdns.org$request_uri; }
    }

    server {
        listen 80;
        server_name uniform.gaaala.duckdns.org trading.gaaala.duckdns.org
                    sunduk.gaaala.duckdns.org sizo.gaaala.duckdns.org
                    nemakh.gaaala.duckdns.org n8n.gaaala.duckdns.org
                    adminer.gaaala.duckdns.org halliem.gaaala.duckdns.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS default_server — обращение по голому IP.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 301 https://gaaala.duckdns.org$request_uri;
    }

    # ──────────────────────────────────────────────────────────────────
    # GALA (gaaala.duckdns.org) — TLS терминируется здесь, всё остальное
    # (приложение, /api, статика, /deploy/vsks-crm, /n8n/ path-роут) живёт
    # в GALA-nginx (nginx/nginx.conf VSKS-репозитория) за host.docker.internal
    # :8079. Заголовки безопасности (HSTS и т.п.) НЕ дублируются здесь —
    # GALA-nginx уже выставляет их на каждой своей location (правило №6,
    # единственный источник), edge их просто прозрачно проксирует клиенту.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name gaaala.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            # GALA — по ИМЕНИ сервиса в общей сети vsks-crm_default, не через
            # host.docker.internal: наш nginx публикует 8079 только на
            # 127.0.0.1, а host-gateway из контейнера — это адрес докер-моста
            # (172.17.0.1), туда loopback не отвечает. Проверено на проде
            # 2026-09-05: «Connection refused» с моста, 200 по имени.
            # Переменная — чтобы имя перерезолвивалось (resolver выше), а не
            # застывало на IP пересозданного контейнера.
            set $gala_upstream http://nginx:80;
            proxy_pass $gala_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # Uniform — БЕЗ ИЗМЕНЕНИЙ относительно старого nginx/nginx.conf VSKS.
    server {
        listen 443 ssl http2;
        server_name uniform.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Trading bot dashboard (DO NOT REMOVE - restored by trading-guard —
    # !!! trading-guard должен быть перенаправлен на /opt/edge-nginx/nginx.conf,
    # см. README.md пункт про сторожей).
    server {
        listen 443 ssl http2;
        server_name trading.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location = /deploy/trading-bot {
            proxy_pass http://172.17.0.1:9001/deploy/trading-bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://172.17.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }

    # Sunduk — БЕЗ ИЗМЕНЕНИЙ.
    server {
        listen 443 ssl http2;
        server_name sunduk.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # СИЗО — БЕЗ ИЗМЕНЕНИЙ.
    server {
        listen 443 ssl http2;
        server_name sizo.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # NEMAKH — БЕЗ ИЗМЕНЕНИЙ.
    server {
        listen 443 ssl http2;
        server_name nemakh.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:6080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # n8n.gaaala.duckdns.org — резолвится по имени сервиса ВНУТРИ сети
    # vsks-crm_default (edge подключён к ней как external, см.
    # deploy/edge/docker-compose.yml). Авторизация — собственный basic-auth
    # n8n (N8N_BASIC_AUTH_* в docker-compose.yml VSKS), не дублируем.
    server {
        listen 443 ssl http2;
        server_name n8n.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Adminer — резолвится по имени сервиса ВНУТРИ сети vsks-crm_default,
    # ТАК ЖЕ, как раньше резолвился внутри единого nginx VSKS. Свой
    # basic-auth (правило №4: UI без авторизации наружу не публиковать) —
    # htpasswd теперь готовит install.sh (читает ADMINER_HTPASSWD из
    # /opt/vsks-crm/.env и пишет в /opt/edge-nginx/secrets/adminer.htpasswd,
    # см. install.sh) — тот же пароль, что был, просто источник истины для
    # него теперь edge, а не VSKS-nginx (у которого location adminer больше
    # нет вообще).
    server {
        listen 443 ssl http2;
        server_name adminer.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            auth_basic "Adminer";
            auth_basic_user_file /etc/nginx/secrets/adminer.htpasswd;
            set $adminer_upstream http://adminer:8080;
            proxy_pass $adminer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # FruitShop/halliem — БЕЗ ИЗМЕНЕНИЙ. !!! fruits-guard должен быть
    # перенаправлен на /opt/edge-nginx/nginx.conf, см. README.md.
    server {
        listen 443 ssl http2;
        server_name halliem.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location /deploy/fruits {
            proxy_pass http://172.17.0.1:9101/deploy/fruits;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_read_timeout 600s;
        }
        location / {
            proxy_pass http://host.docker.internal:4100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}

# mail/opendkim.conf — подпись исходящих писем доменом galaa.ru, селектор gala.
# Ключ генерируется entrypoint.sh при первом старте в /etc/opendkim/keys (смонтированный
# volume — переживает пересоздание контейнера, см. docker-compose.yml). По образцу FOODSIZO
# server/mail-relay/opendkim.conf.

Domain                  galaa.ru
Selector                gala
KeyFile                 /etc/opendkim/keys/gala.private

# Слушаем только на localhost — milter доступен лишь Postfix в этом же контейнере (main.cf:
# smtpd_milters = inet:127.0.0.1:8891), наружу не торчит в любом случае (контейнер без ports:).
Socket                  inet:8891@127.0.0.1

Syslog                  yes
SyslogSuccess           yes
LogWhy                  no

Canonicalization        relaxed/simple
Mode                    s
SubDomains              no

UserID                  opendkim:opendkim
UMask                   022

# Подписываем всё, что уходит от нашего домена (ExternalIgnoreList/InternalHosts не нужны —
# это внутренний relay-only сервер, см. main.cf: mynetworks + smtpd_sender_restrictions
# ограничивают, кто вообще может отправить письмо через него и с каким From).

events {}

http {
    client_max_body_size 50m;

    # Use Docker's embedded DNS resolver so upstream names are re-resolved
    # after container restarts (prevents stale IP caching / 502 errors)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ──────────────────────────────────────────────────────────────────
    # Phase «разрез edge/GALA» (2026-09-05): этот файл раньше держал 80/443
    # и обслуживал ВСЕ домены сервера (uniform/trading/sunduk/sizo/nemakh/
    # n8n/adminer/halliem вперемешку с самим GALA). Теперь он отвечает
    # ТОЛЬКО за gaaala.duckdns.org: TLS, чужие домены и ACME-заглушка
    # переехали в deploy/edge/nginx.conf (отдельный compose-проект на
    # сервере в /opt/edge-nginx/, вне git-дерева VSKS — autodeploy.sh его
    # не трогает никогда). Смысл: ошибка в PR VSKS (например синтаксическая,
    # ведущая к провалу `nginx -t`) теперь физически не может положить
    # 80/443 для соседей — этот контейнер их больше не держит совсем,
    # слушает только внутренний 127.0.0.1:8079 (см. docker-compose.yml,
    # сервис nginx, порт), plain HTTP — TLS терминирует edge.
    #
    # Что перестало быть здесь нужным и НАМЕРЕННО НЕ вычищено из
    # docker-compose.yml/entrypoint.sh (минимальный риск диффа после
    # инцидента 2026-09-04): self-signed placeholder и adminer.htpasswd
    # в entrypoint.sh, ADMINER_HTPASSWD env, /etc/letsencrypt volume, 6-часовой
    # reload-цикл в command — всё это теперь просто «висит вхолостую»
    # (entrypoint.sh увидит уже существующий боевой сертификат и ничего не
    # запишет; adminer.htpasswd больше никем не читается, потому что
    # location'а adminer в этом файле больше нет). Затрат по факту ноль,
    # трогать не стали, чтобы не расширять диф там, где это не обязательно.
    #
    # Единственный внешний путь, который остаётся здесь (не переехал на
    # edge) — /deploy/vsks-crm: это ЧАСТЬ ПРИЛОЖЕНИЯ VSKS, а не общая
    # инфраструктура, и логично живёт рядом с самим VSKS. edge просто
    # проксирует gaaala.duckdns.org сюда целиком (location / ниже уже сам
    # маршрутизирует /deploy/vsks-crm), никакого location для него на edge
    # заводить не нужно.
    # ──────────────────────────────────────────────────────────────────
    upstream backend_pool {
        server backend_a:8000 max_fails=1 fail_timeout=2s;
        server backend_b:8000 max_fails=1 fail_timeout=2s;
    }

    upstream frontend_pool {
        server frontend_a:3080 max_fails=1 fail_timeout=2s;
        server frontend_b:3080 max_fails=1 fail_timeout=2s;
    }

    # ──────────────────────────────────────────────────────────────────
    # Локальная разработка: этот же compose поднимается на машине разработчика,
    # и без явного блока Host: localhost улетал бы в основной блок ниже
    # (который теперь default_server — см. его комментарий). Наружу этот
    # блок не эксплуатируется: чтобы в него попасть, клиент должен сам
    # подставить Host: localhost.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location /api {
            proxy_pass http://backend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location ~* ^/(sw|workbox-[a-f0-9]+|registerSW|sw-register)\.js$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ──────────────────────────────────────────────────────────────────
    # GALA (gaaala.duckdns.org) — единственный внешний домен, за который
    # отвечает этот файл. default_server: edge всегда шлёт сюда Host:
    # gaaala.duckdns.org, но default_server — защитный минимум на случай
    # любого другого/пустого Host, дошедшего до порта 8079 (например прямой
    # curl на 127.0.0.1:8079 в диагностике) — тоже должен увидеть приложение,
    # а не первый попавшийся блок по случайному порядку в файле.
    #
    # TLS здесь больше нет (терминирует edge) — заголовки безопасности
    # (HSTS и т.д.) ПО-ПРЕЖНЕМУ выставляются здесь (единственный источник —
    # правило №6 CLAUDE.md), edge их не дублирует: ответ проксируется через
    # edge к клиенту заголовками как есть.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name gaaala.duckdns.org;

        # Веб-корень не отдаёт служебные каталоги (правило №4 аудита).
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }

        # Деплой-вебхук VSKS.
        location = /deploy/vsks-crm {
            proxy_pass http://172.17.0.1:9000/deploy/vsks-crm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        location /api {
            proxy_pass http://backend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /n8n/ {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~* ^/(sw|workbox-[a-f0-9]+|registerSW|sw-register)\.js$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}

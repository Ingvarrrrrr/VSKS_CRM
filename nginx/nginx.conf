events {}

http {
    client_max_body_size 50m;

    # Use Docker's embedded DNS resolver so upstream names are re-resolved
    # after container restarts (prevents stale IP caching / 502 errors)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ──────────────────────────────────────────────────────────────────
    # Бесшовный деплой (2026-09-04): backend/frontend теперь по ДВЕ реплики
    # каждый (backend_a/backend_b, frontend_a/frontend_b — см.
    # docker-compose.yml). autodeploy.sh пересоздаёт их ПООЧЕРЁДНО. Пока одна
    # реплика перезапускается (недоступна секунды-десятки секунд — миграции +
    # инициализация), nginx обязан САМ уводить запрос на вторую, живую,
    # реплику — иначе клиент всё равно увидит 502 ровно в тот момент, когда
    # обновляется первая реплика.
    #
    # Именно поэтому здесь НАСТОЯЩИЙ upstream-блок (со статическим списком
    # серверов), а не прежний трюк `set $var http://backend:8000; proxy_pass
    # $var;` — тот вариант отдаёт nginx РОВНО ОДИН резолвленный адрес на
    # запрос и никогда не переключается на другой по ошибке соединения
    # (proxy_next_upstream работает только внутри upstream{}). Статическое
    # DNS-имя каждой реплики (backend_a/backend_b) при обычном деплое НЕ
    # меняется (autodeploy.sh трогает по одной, вторая всё это время жива и
    # её IP не пересоздаётся) — а IP той реплики, которую как раз пересоздали,
    # nginx подхватывает через `nginx -s reload` сразу после её healthcheck
    # (см. autodeploy.sh, roll_replica). До reload nginx ещё видит её старый
    # (мёртвый) IP — но proxy_next_upstream в этот момент просто уводит
    # запрос на вторую реплику, отказов клиент не видит.
    #
    # ВАЖНО: этот же файл по-прежнему обслуживает ВСЕ домены сервера (не
    # только GALA) — TLS, чужие проекты, webhook. autodeploy.sh поэтому
    # НИКОГДА не пересоздаёт контейнер nginx (это уронило бы порты 80/443 для
    # всех сразу), только `nginx -t && nginx -s reload` (graceful) после
    # проверки конфига.
    upstream backend_pool {
        server backend_a:8000 max_fails=1 fail_timeout=2s;
        server backend_b:8000 max_fails=1 fail_timeout=2s;
    }

    upstream frontend_pool {
        server frontend_a:3080 max_fails=1 fail_timeout=2s;
        server frontend_b:3080 max_fails=1 fail_timeout=2s;
    }

    # ──────────────────────────────────────────────────────────────────
    # Phase 30: HTTP → HTTPS redirect для домена gaaala.duckdns.org
    # IP-доступ (85.239.53.155) остаётся через default_server на 80 ниже.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name gaaala.duckdns.org;

        # ACME HTTP-01 challenge — на случай если когда-то понадобится
        # (сейчас выпуск через DNS-01, но location безвреден).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────────
    # Локальная разработка: этот же compose поднимается на машине разработчика,
    # и без явного блока Host: localhost улетал бы редиректом на ПРОД.
    # Наружу этот блок не эксплуатируется: чтобы в него попасть, клиент должен
    # сам подставить Host: localhost, то есть сам выбрать plaintext — защита
    # редиректом рассчитана на обычный браузер, а не на такого клиента.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location /api {
            proxy_pass http://backend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location ~* ^/(sw|workbox-[a-f0-9]+|registerSW|sw-register)\.js$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ──────────────────────────────────────────────────────────────────
    # HTTP server (порт 80) — default_server fallback: сюда попадает
    # обращение по голому IP (85.239.53.155) и любой неизвестный Host.
    #
    # CRIT-1 (аудит 2026-07-25): раньше этот блок отдавал приложение и
    # форму логина по plaintext HTTP. Правку делали руками на проде, и
    # autodeploy.sh (git checkout -f + git clean -fd) её стёр. Теперь она
    # живёт в репозитории — иначе потеряется снова.
    #
    # Наружу по HTTP остаются ровно два пути:
    #   /deploy/         — GitHub бьёт вебхуком по IP, 301 сломает автодеплой
    #   /.well-known/…   — ACME-challenge для выпуска сертификата
    # Всё остальное уходит 301 на домен.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /deploy/ {
            proxy_pass http://172.17.0.1:9000/deploy/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        # Явный домен, а не $host: при обращении по IP $host = 85.239.53.155,
        # и редирект увёл бы обратно на IP (петля + чужое имя в сертификате).
        location / {
            return 301 https://gaaala.duckdns.org$request_uri;
        }
    }

    # HTTPS default_server: обращение к https://85.239.53.155 не должно
    # молча попадать в первый попавшийся 443-блок. Предупреждение о
    # несовпадении имени сертификата неизбежно (сертификата на IP нет),
    # но после него браузер уводится на домен.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://gaaala.duckdns.org$request_uri;
    }

    # ──────────────────────────────────────────────────────────────────
    # HTTPS server (порт 443) для gaaala.duckdns.org.
    # Сертификат выпускается через certbot DNS-01 challenge (DuckDNS API).
    # См. scripts/setup-ssl.sh для первоначального issuance.
    # ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name gaaala.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;

        # Современный SSL-конфиг (Mozilla intermediate, ~94% совместимость)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — 6 месяцев. Включаем только после первой успешной установки
        # сертификата (если HSTS включить до cert, браузер заблокирует домен).
        #
        # ВНИМАНИЕ: nginx НЕ наследует add_header в location, где есть свой
        # add_header. У /, статики и sw.js ниже свои Cache-Control/Pragma —
        # поэтому весь набор заголовков продублирован внутрь каждого из них.
        # Убрать дубли нельзя: заголовки просто перестанут отдаваться.
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Веб-корень не отдаёт служебные каталоги (правило №4 аудита).
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }

        # Деплой-вебхук VSKS: раньше GitHub бил в открытый http://IP/deploy/vsks-crm
        location = /deploy/vsks-crm {
            proxy_pass http://172.17.0.1:9000/deploy/vsks-crm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        location /api {
            proxy_pass http://backend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /n8n/ {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~* ^/(sw|workbox-[a-f0-9]+|registerSW|sw-register)\.js$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Strict-Transport-Security "max-age=15768000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    server {
        listen 80;
        server_name uniform.gaaala.duckdns.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name uniform.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Trading bot dashboard HTTP (DO NOT REMOVE - restored by trading-guard)
    server {
        listen 80;
        server_name trading.gaaala.duckdns.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # Trading bot dashboard HTTPS (DO NOT REMOVE - restored by trading-guard)
    server {
        listen 443 ssl http2;
        server_name trading.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        # Деплой-вебхук трейдинг-бота: раньше GitHub бил в открытый http://IP:9001
        location = /deploy/trading-bot {
            proxy_pass http://172.17.0.1:9001/deploy/trading-bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://172.17.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }

    # ──────────────────────────────────────────────────────────────────
    # Phase 30-xx: новые поддомены *.gaaala.duckdns.org (IP сервера сменился
    # 85.239.53.155 → 201.34.139.168, старые *.85.239.53.155.nip.io имена
    # умерли — nip.io резолвит по IP, зашитому в само имя). DuckDNS wildcard
    # DNS следует за текущим IP (cron обновляет каждые 5 минут), сертификат —
    # общий wildcard *.gaaala.duckdns.org (см. scripts/setup-ssl.sh, DNS-01).
    # ──────────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name sunduk.gaaala.duckdns.org sizo.gaaala.duckdns.org nemakh.gaaala.duckdns.org n8n.gaaala.duckdns.org adminer.gaaala.duckdns.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # Sunduk — фронт/API отдаёт единый контейнер sunduk-app (хостовый порт 8081).
    server {
        listen 443 ssl http2;
        server_name sunduk.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # СИЗО — sizo-web (хостовый порт 8091), сам маршрутизирует /api к sizo-api
    # внутри своей docker-сети sizo-net.
    server {
        listen 443 ssl http2;
        server_name sizo.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # NEMAKH — nemakh-nginx (хостовый порт 6080).
    server {
        listen 443 ssl http2;
        server_name nemakh.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            proxy_pass http://host.docker.internal:6080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # n8n на отдельном поддомене (тот же сервис, что и /n8n/ на основном
    # домене). Авторизация — собственный basic-auth n8n (N8N_BASIC_AUTH_*
    # в docker-compose.yml), доступ на уровне nginx не дублируем.
    server {
        listen 443 ssl http2;
        server_name n8n.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Adminer — вспомогательная админка БД, СВОЙ basic-auth поверх nginx
    # (правило №4 чеклиста: UI без авторизации наружу не публиковать).
    # Пароль сгенерирован при выпуске этого блока, файл вне git —
    # /opt/vsks-crm-secrets/adminer.htpasswd на сервере (см. docker-compose.yml).
    server {
        listen 443 ssl http2;
        server_name adminer.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location / {
            auth_basic "Adminer";
            auth_basic_user_file /etc/nginx/secrets/adminer.htpasswd;
            set $adminer_upstream http://adminer:8080;
            proxy_pass $adminer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }


    # FruitShop — владелец назвал имя halliem (halliem.ru/.com/.store/.shop/
    # .online/.site свободны, но не зарегистрированы; в DuckDNS-аккаунте
    # "halliem" не создан — update API вернул KO). Публикуем на wildcard-имени,
    # уже покрытом сертификатом *.gaaala.duckdns.org, тем же паттерном, что
    # sunduk/sizo/nemakh. Старый server_name fruits.85.239.53.155.nip.io
    # удалён — старый IP мёртв, имя больше не резолвится, смысла держать нет.
    #
    # /deploy/fruits (GitHub webhook → 127.0.0.1:9101) сохранён с прежним
    # путём — это отдельный процесс на хосте (python3, systemd fruits-webhook),
    # не завязан на конкретное доменное имя, ломать его не за чем.
    #
    # На сервере есть systemd-таймер fruits-guard (/opt/fruits-guard/
    # check-vsks-config.sh, юнит fruits-guard.timer, вне git — живёт только
    # на хосте), который следит, чтобы деплой VSKS не снёс эту интеграцию:
    # если в nginx.conf пропадает директива `server_name halliem.gaaala.
    # duckdns.org;` или location /deploy/fruits, он сам переписывает
    # /opt/vsks-crm/nginx/nginx.conf и docker-compose.yml на сервере (в обход
    # git) и передёргивает nginx. Обновлено вместе с этим блоком (было —
    # проверяло мёртвую подстроку "fruits.85.239", которая случайно совпадала
    # даже с текстом комментария и потому могла молчать при реальной
    # поломке); теперь проверка заякорена на настоящий server_name, а не на
    # произвольное вхождение подстроки. Аналогичный сторож trading-guard
    # (/opt/trading-guard/check-nginx.sh) следит за блоком trading-bot ниже.
    server {
        listen 80;
        server_name halliem.gaaala.duckdns.org;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name halliem.gaaala.duckdns.org;
        ssl_certificate     /etc/letsencrypt/live/gaaala.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaaala.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location ~ /\.(git|env|svn|hg)(/|$) { return 404; }
        location /deploy/fruits {
            proxy_pass http://172.17.0.1:9101/deploy/fruits;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_read_timeout 600s;
        }
        location / {
            proxy_pass http://host.docker.internal:4100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }

}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GALA — Управление закупками</title>

    <!-- PWA -->
    <meta name="theme-color" content="#fb923c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GALA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0e0c'/%3E%3Cpath d='M22 6 L8 6 L8 26 L22 26 L22 17 L15 17' stroke='%23fb923c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />

    <!-- M5: брендовый фон под status-bar и до загрузки Vue — убирает белую вспышку
         при запуске PWA на iOS/Android (apple-touch-startup-image требует device-точные
         PNG, которых нет; фон даёт тот же эффект «нет белого флэша» без ассетов). -->
    <style>
      html, body { margin: 0; background-color: #0f0e0c; }
      @media (prefers-color-scheme: light) { html, body { background-color: #ffffff; } }
      #app:empty::after {
        content: '';
        position: fixed; inset: 0;
        background: #0f0e0c url("/pwa-192x192.png") center / 72px no-repeat;
        opacity: 0.9;
      }
    </style>

    <!-- Локальные шрифты (офлайн): объявлены через @font-face в src/styles/gala.css, файлы в public/fonts/.
         Preload основных начертаний, чтобы не было FOUT при старте. -->
    <link rel="preload" href="/fonts/syne-v24-latin-800.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/inter-tight-v9-latin-regular.ttf" as="font" type="font/ttf" crossorigin>

    <!-- Phase 26-FFF: one-time SW + cache cleanup для пользователей со старым bundle.
         Срабатывает максимум 1 раз (флаг в localStorage). Помогает тем кто впервые
         получил свежий index.html (после убирания html из precache в vite.config). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('phase29_3_R3_2026_05_26') === '1') return;
          if (!('serviceWorker' in navigator) || !('caches' in window)) {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            return;
          }
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }),
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          ]).then(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            window.location.reload();
          }).catch(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
          });
        } catch (e) {
          try { localStorage.setItem('phase29_3_R3_2026_05_26', '1'); } catch (_) { /* noop */ }
        }
      })();
    </script>

    <!-- Self-heal: если закэшированный index.html ссылается на удалённый JS/CSS-чанк
         (404 → белый экран), ловим ошибку загрузки ассета, чистим SW+кэши и
         перезагружаемся ОДИН раз за сессию (guard от цикла, окно 30с). В отличие
         от one-time флага выше — срабатывает на КАЖДЫЙ будущий устаревший билд. -->
    <script>
      (function () {
        function isAssetFail(t) {
          if (!t) return false;
          var src = t.src || t.href || '';
          return (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && src.indexOf('/assets/') !== -1;
        }
        window.addEventListener('error', function (e) {
          if (!isAssetFail(e.target)) return;
          try {
            var last = +(sessionStorage.getItem('gala_chunk_reload_ts') || 0);
            if (Date.now() - last < 30000) return; // уже чинились недавно — не зацикливаемся
            sessionStorage.setItem('gala_chunk_reload_ts', String(Date.now()));
          } catch (_) { return; }
          var done = function () { window.location.reload(); };
          try {
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if ('caches' in window) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(done).catch(done);
          } catch (_) { done(); }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

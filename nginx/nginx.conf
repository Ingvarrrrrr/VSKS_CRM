events {}

http {
    client_max_body_size 50m;

    # Use Docker's embedded DNS resolver so upstream names are re-resolved
    # after container restarts (prevents stale IP caching / 502 errors)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            # WebSocket support — required for /api/ws/chat
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /n8n/ {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /deploy/ {
            proxy_pass http://172.17.0.1:9000/deploy/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        }

        # Static assets with hash in filename — cache aggressively
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            set $frontend_upstream http://frontend:3080;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            set $frontend_upstream http://frontend:3080;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Prevent browser caching of index.html so new deploys are picked up
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    server {
        listen 80;
        server_name uniform.85.239.53.155.nip.io;
        location / {
            proxy_pass http://host.docker.internal:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Передача оборудования ВСКС — карта процессов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1b2e;
    --bg2: #22233a;
    --bg3: #2d2e4a;
    --border: #3a3b5c;
    --text: #e2e4f0;
    --text2: #9fa3c0;
    --text3: #6b6e8a;
    --dot: rgba(100,108,180,0.18);
    --c0: #7c6af5;
    --c1: #4ecdc4;
    --c2: #f7b731;
    --c3: #45b7d1;
    --c4: #96ceb4;
    --c5: #ff6b6b;
    --c6: #a29bfe;
    --c7: #fd79a8;
    --c8: #00cec9;
    --c9: #e67e22;
    --ok: #26de81;
    --warn: #f9ca24;
    --fail: #fc5c65;
  }

  html[data-theme="light"] {
    --bg:     #f5f6fa;
    --bg2:    #eceef5;
    --bg3:    #ffffff;
    --border: #d4d7e3;
    --text:   #1a1b2e;
    --text2:  #52557a;
    --text3:  #8a8ca8;
    --dot:    rgba(80,90,160,0.12);
    --c0: #6250e0;
    --c1: #2eb5ac;
    --c2: #c48a00;
    --c3: #2490b5;
    --c4: #5a9e7e;
    --c5: #e04040;
    --c6: #7a6fe0;
    --c7: #d45a8a;
    --c8: #009e9a;
    --c9: #b85c1a;
    --ok:   #18a558;
    --warn: #d39e00;
    --fail: #d63040;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background-color .2s, color .2s;
  }

  .header, .content, .legend-bar, .lane-body, .lane-header,
  .proc-card, .status-node-card, .doc-card,
  .node, .zoom-btn, .pdf-btn, .tab,
  .docs-toolbar, .canvas-scroll {
    transition: background-color .2s, color .2s, border-color .2s, box-shadow .2s;
  }

  /* HEADER */
  .header {
    flex-shrink: 0;
    padding: 12px 20px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header h1 span { color: var(--c0); }

  /* HEADER ACTIONS */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .header-actions h1 { margin-right: 4px; margin-bottom: 0; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.18s ease;
    white-space: nowrap;
    min-height: 36px;
    display: flex;
    align-items: center;
  }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active {
    color: var(--text);
    background: var(--bg2);
    border-color: var(--border);
    border-bottom: 1px solid var(--bg2);
    margin-bottom: -1px;
    position: relative;
    z-index: 1;
  }

  /* CONTENT AREA */
  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg2);
  }

  .view { display: none; width: 100%; height: 100%; }
  .view.active { display: flex; flex-direction: column; }

  /* LEGEND */
  .legend-bar {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .legend-bar .l-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-right: 4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text2);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* SWIMLANE CANVAS */
  .canvas-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
    user-select: none;
  }
  .canvas-wrap.grabbing { cursor: grabbing; }

  .canvas-inner {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    min-width: 100%;
    min-height: 100%;
  }

  .canvas-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .lanes-container {
    display: flex;
    position: relative;
    padding: 0;
  }

  .lane-col {
    flex-shrink: 0;
    width: 220px;
    position: relative;
  }

  .lane-header {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 10px 12px 8px;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    border-bottom: 2px solid;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--bg);
    border-right: 1px solid var(--border);
  }

  .lane-body {
    position: relative;
    min-height: 400px;
    border-right: 1px solid var(--border);
    background: var(--bg2);
  }
  .lane-col:last-child .lane-header,
  .lane-col:last-child .lane-body { border-right: none; }

  .node {
    position: absolute;
    left: 10px;
    width: 196px;
    background: var(--bg3);
    border-radius: 10px;
    border-left: 3px solid;
    padding: 10px 11px 8px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .node:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .node.highlighted {
    box-shadow: 0 0 0 2px currentColor, 0 6px 20px rgba(0,0,0,0.5);
  }

  .node-seq {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.08);
    color: var(--text2);
    letter-spacing: 0.3px;
  }

  .node-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .node.expanded .node-text {
    -webkit-line-clamp: unset;
    overflow: visible;
  }
  .node-more {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    cursor: pointer;
  }
  .node-more:hover { color: var(--text2); }

  .connectors-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  .connector {
    fill: none;
    stroke-width: 1.5;
    stroke-opacity: 0.35;
    transition: stroke-opacity 0.2s;
  }
  .connector.highlighted { stroke-opacity: 0.9; stroke-width: 2.5; }
  .connector-arrow { fill-opacity: 0.35; transition: fill-opacity 0.2s; }
  .connector-arrow.highlighted { fill-opacity: 0.9; }

  .zoom-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 20;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .zoom-btn:hover { background: var(--border); }

  /* STATUS FLOW VIEW */
  .status-view {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .status-view::-webkit-scrollbar { width: 6px; }
  .status-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .status-flow {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
  }
  .status-flow::before {
    content: '';
    position: absolute;
    left: 20px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--c0), var(--c6));
    opacity: 0.3;
  }

  .status-node {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 14px 0;
    position: relative;
  }
  .status-node-num {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
    z-index: 1;
    border: 2px solid;
  }
  .status-node-num.ok { background: rgba(38,222,129,0.12); border-color: var(--ok); color: var(--ok); }
  .status-node-num.warn { background: rgba(249,202,36,0.12); border-color: var(--warn); color: var(--warn); }
  .status-node-num.fail { background: rgba(252,92,101,0.12); border-color: var(--fail); color: var(--fail); }

  .status-node-card {
    flex: 1;
    background: var(--bg3);
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    transition: box-shadow 0.15s;
  }
  .status-node-card.fail {
    border-color: rgba(252,92,101,0.4);
    box-shadow: 0 0 0 1px rgba(252,92,101,0.2), inset 0 0 20px rgba(252,92,101,0.05);
  }
  .status-node-card.warn {
    border-color: rgba(249,202,36,0.3);
  }
  .status-node-process {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .status-node-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .meta-item { font-size: 11px; }
  .meta-label { color: var(--text3); margin-right: 4px; }
  .meta-val { color: var(--text2); }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    margin-top: 8px;
  }
  .status-badge.ok { background: rgba(38,222,129,0.12); color: var(--ok); }
  .status-badge.warn { background: rgba(249,202,36,0.12); color: var(--warn); }
  .status-badge.fail { background: rgba(252,92,101,0.12); color: var(--fail); }
  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* DOCUMENTS VIEW */
  .docs-view {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .docs-view::-webkit-scrollbar { width: 6px; }
  .docs-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .docs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .doc-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: border-color 0.15s, transform 0.15s;
  }
  .doc-card:hover {
    border-color: var(--c3);
    transform: translateY(-2px);
  }
  .doc-num {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(69,183,209,0.15);
    color: var(--c3);
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .doc-name {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .doc-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 6px;
    margin-right: 4px;
  }
  .doc-tag.cu-ro { background: rgba(124,106,245,0.15); color: var(--c0); }
  .doc-tag.ro { background: rgba(78,205,196,0.15); color: var(--c1); }
  .doc-tag.cu { background: rgba(255,107,107,0.15); color: var(--c5); }

  .docs-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  .docs-section-title:not(:first-child) { margin-top: 24px; }

  .canvas-scroll {
    flex: 1;
    overflow: auto;
    position: relative;
  }
  .canvas-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .canvas-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .canvas-scroll::-webkit-scrollbar-corner { background: var(--bg2); }

  .scale-hint {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: var(--text3);
    z-index: 20;
    pointer-events: none;
  }

  /* PDF EXPORT */
  .pdf-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
    user-select: none;
    font-family: inherit;
    height: 32px;
  }
  .pdf-btn:hover {
    background: var(--border);
    color: var(--text);
    border-color: var(--c0);
  }

  .docs-toolbar {
    flex-shrink: 0;
    padding: 8px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ═══════════════════════════════════════════════════
     PROCESS FLOW
     ═══════════════════════════════════════════════════ */
  .proc-flow-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 48px;
  }
  .proc-flow-scroll::-webkit-scrollbar { width: 6px; }
  .proc-flow-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .proc-flow {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
  }

  .proc-flow::before {
    content: '';
    position: absolute;
    left: 20px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--c0), var(--c6));
    opacity: 0.25;
    z-index: 0;
  }

  .proc-node {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    padding: 12px 0;
    position: relative;
  }

  .proc-num {
    flex-shrink: 0;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(124,106,245,0.12);
    border: 2px solid rgba(124,106,245,0.35);
    color: var(--text2);
    font-size: 14px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
    position: relative;
    overflow: hidden;
  }
  .proc-num-label {
    position: relative;
    z-index: 2;
    font-weight: 700;
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    color: #fff;
  }

  .proc-card {
    flex: 1;
    background: var(--bg3);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    min-width: 0;
  }

  .proc-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    flex-wrap: wrap;
  }
  .proc-step-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    color: var(--text3);
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .parallel-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(162,155,254,0.15);
    color: var(--c6);
    letter-spacing: 0.2px;
  }

  .proc-card-body {
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .proc-dept-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    margin-bottom: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .proc-task-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
  }

  .proc-cols {
    display: flex;
    align-items: stretch;
  }
  .proc-col {
    flex: 1;
    padding: 14px 16px;
    min-width: 0;
  }
  .proc-col + .proc-col {
    border-left: 1px solid var(--border);
  }

  .proc-arrow {
    text-align: left;
    padding-left: 62px;
    font-size: 14px;
    color: var(--text3);
    line-height: 1;
    user-select: none;
    margin: -4px 0;
  }

  /* PDF overlay */
  #pdf-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,27,46,0.82);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  #pdf-overlay.visible {
    display: flex;
  }
  #pdf-overlay-text {
    font-size: 15px;
    color: var(--text);
    font-weight: 600;
  }
  #pdf-overlay-sub {
    font-size: 12px;
    color: var(--text2);
  }
  .pdf-spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--c0);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  html[data-theme="light"] .proc-card {
    box-shadow: 0 1px 4px rgba(30,40,100,0.10), 0 2px 8px rgba(30,40,100,0.07);
  }
  html[data-theme="light"] .status-node-card {
    box-shadow: 0 1px 4px rgba(30,40,100,0.09);
  }
  html[data-theme="light"] .doc-card {
    box-shadow: 0 1px 3px rgba(30,40,100,0.08);
  }
  html[data-theme="light"] .node {
    box-shadow: 0 1px 4px rgba(30,40,100,0.12);
  }
  html[data-theme="light"] .node:hover {
    box-shadow: 0 4px 14px rgba(30,40,100,0.18);
  }
  html[data-theme="light"] .proc-card-header {
    background: rgba(0,0,0,0.03);
  }
  html[data-theme="light"] .proc-step-badge {
    background: rgba(0,0,0,0.06);
    color: var(--text3);
  }
  html[data-theme="light"] .node-seq {
    background: rgba(0,0,0,0.06);
  }
  html[data-theme="light"] #pdf-overlay {
    background: rgba(240,242,250,0.88);
  }

  #themeToggleBtn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
    user-select: none;
    font-family: inherit;
    height: 32px;
  }
  #themeToggleBtn:hover {
    background: var(--border);
    color: var(--text);
    border-color: var(--c0);
  }

// ─── ROLE COLOR MAP ────────────────────────────────────────────────────────────
const ROLE_COLORS = {
  'Руководитель организации': 'var(--c0)',
  'Заинтересованное лицо': 'var(--c1)',
  'Руководитель отделения': 'var(--c1)',
  'Предыдущий руководитель отделения': 'var(--c1)',
  'МТО': 'var(--c2)',
  'Рег.Отдел': 'var(--c3)',
  'Бухгалтерия': 'var(--c4)',
  'Аппарат': 'var(--c5)',
  'Исполком': 'var(--c6)',
  'Материально ответственное лицо': 'var(--c7)',
  'Новый руководитель отделения': 'var(--c8)',
  'Инвентаризационная комиссия': 'var(--c9)',
};

const CSS_VARS = {
  '--c0':'#7c6af5','--c1':'#4ecdc4','--c2':'#f7b731','--c3':'#45b7d1',
  '--c4':'#96ceb4','--c5':'#ff6b6b','--c6':'#a29bfe','--c7':'#fd79a8','--c8':'#00cec9','--c9':'#e67e22'
};
function resolveColor(v) { return CSS_VARS[v.replace(/var\(|\)/g,'').trim()] || v; }
function roleColor(name) { return ROLE_COLORS[name] || 'var(--c3)'; }
function roleColorHex(name) { return resolveColor(roleColor(name)); }

// Pie background for multi-colour step numbers (html2canvas can't render conic-gradient,
// so we rasterise equal sectors onto a canvas and use it as a background image).
function makePieDataUrl(colors) {
  const size = 84;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const r = size / 2;
  const seg = (Math.PI * 2) / colors.length;
  let start = -Math.PI / 2;
  colors.forEach(col => {
    ctx.beginPath();
    ctx.moveTo(r, r);
    ctx.arc(r, r, r, start, start + seg);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    start += seg;
  });
  return c.toDataURL('image/png');
}

// ─── DEEP COPY ────────────────────────────────────────────────────────────────
function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

// ─── NORMALIZE: steps[] → levels[] ───────────────────────────────────────────
// level = { tasks: [ { deptIndexes:[], text:'' }, ... ] }
function stepsToLevels(steps) {
  const seqMap = {};
  steps.forEach(step => {
    const key = step.seq;
    if (!seqMap[key]) seqMap[key] = [];
    seqMap[key].push(step);
  });
  const seqs = Object.keys(seqMap).map(Number).sort((a, b) => a - b);
  return seqs.map(seq => {
    const stepsForSeq = seqMap[seq];
    const taskMap = new Map(); // text -> Set of laneIndexes
    stepsForSeq.forEach(step => {
      if (!taskMap.has(step.text)) taskMap.set(step.text, []);
      step.lanes.forEach(li => {
        if (!taskMap.get(step.text).includes(li)) taskMap.get(step.text).push(li);
      });
    });
    const tasks = [];
    const seen = new Set();
    stepsForSeq.forEach(step => {
      if (!seen.has(step.text)) {
        seen.add(step.text);
        tasks.push({ deptIndexes: taskMap.get(step.text), text: step.text });
      }
    });
    return { tasks };
  });
}

// ─── NORMALIZE: levels[] → steps[] (for export/save compat) ──────────────────
function levelsToSteps(levels) {
  const steps = [];
  levels.forEach((level, li) => {
    const seq = li + 1;
    level.tasks.forEach(task => {
      // If multiple dept indexes, each as lanes[] per step
      steps.push({ seq, lanes: task.deptIndexes.slice(), text: task.text });
    });
  });
  return steps;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
const STATE_KEY = 'vsks_data';

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.swimlanes) return parsed;
    }
  } catch(e) {}
  return null;
}

const INVENTORY_DEPT = 'Инвентаризационная комиссия';
const ORDER_DEFAULT = { decree: '34', date: '01.06.2026' };
function migrateData(data) {
  if (data && Array.isArray(data.swimlanes)) {
    if (!data.order) data.order = { ...ORDER_DEFAULT };
    if (data.orderEnabled == null) data.orderEnabled = true;
    data.swimlanes.forEach((sl, idx) => {
      if (Array.isArray(sl.roles) && !sl.roles.includes(INVENTORY_DEPT)) {
        sl.roles.push(INVENTORY_DEPT);
      }
      if (sl.appendixNo == null) sl.appendixNo = idx + 1;
      if (sl.decree == null) sl.decree = (data.order && data.order.decree) || ORDER_DEFAULT.decree;
      if (sl.date == null) sl.date = (data.order && data.order.date) || ORDER_DEFAULT.date;
    });
  }
  return data;
}

const STATE = { data: migrateData(loadState() || deepCopy(DATA)) };

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(STATE.data));
    showSaveIndicator();
  } catch(e) {}
}

let _saveTimer = null;
function showSaveIndicator() {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

// ─── TABS DEFINITION ──────────────────────────────────────────────────────────
function buildTabs() {
  return [
    ...STATE.data.swimlanes.map(sl => ({ id: 'sl_'+sl.id, label: sl.title, type: 'swimlane', slId: sl.id })),
    { id: 'status_flow', label: 'Как есть сейчас', type: 'status' },
    { id: 'documents',   label: 'Документы',       type: 'docs'   },
  ];
}

let TABS = buildTabs();
let activeTab = TABS[0].id;
let editMode = false;

// ─── BUILD UI ─────────────────────────────────────────────────────────────────
const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

function rebuildTabBar() {
  TABS = buildTabs();
  tabBar.innerHTML = '';
  TABS.forEach(tab => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (tab.id === activeTab ? ' active' : '');
    btn.textContent = tab.label;
    btn.dataset.id = tab.id;
    btn.addEventListener('click', () => switchTab(tab.id));
    tabBar.appendChild(btn);
  });
}

rebuildTabBar();

function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.id === id));
}

// ─── RENDER ALL VIEWS ─────────────────────────────────────────────────────────
function renderAll() {
  mainContent.innerHTML = '';
  TABS = buildTabs();
  rebuildTabBar();
  TABS.forEach(tab => {
    if (tab.type === 'swimlane') buildSwimlaneView(tab);
    else if (tab.type === 'status') buildStatusView(tab);
    else if (tab.type === 'docs') buildDocsView(tab);
  });
  // ensure active tab is shown
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.id === activeTab));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === activeTab));
}

// ─── RENDER SINGLE TAB ────────────────────────────────────────────────────────
function renderTab(tabId) {
  const existing = mainContent.querySelector(`.view[data-id="${CSS.escape(tabId)}"]`);
  const tab = TABS.find(t => t.id === tabId);
  if (!tab) return;
  const wasActive = existing ? existing.classList.contains('active') : false;
  if (existing) existing.remove();
  let newView;
  if (tab.type === 'swimlane') newView = buildSwimlaneView(tab, true);
  else if (tab.type === 'status') newView = buildStatusView(tab, true);
  else if (tab.type === 'docs') newView = buildDocsView(tab, true);
  if (newView && wasActive) newView.classList.add('active');
}

  orderFields.appendChild(dateLbl);

  titleEdit.appendChild(orderFields);

  // Legend + PDF button

  legend.querySelector('[data-proc-pdf]').addEventListener('click', () => exportTabToPdf(tab.id));

  function renderLevels() {

      if (seenColors.length === 0) {

      } else if (seenColors.length === 1) {

      // Card

      const cardHeader = document.createElement('div');
      cardHeader.className = 'proc-card-header';
      cardHeader.innerHTML = `<span class="proc-step-badge">Шаг ${seq}</span>`;
      if (isParallel) {
        cardHeader.innerHTML += `<span class="parallel-tag">⇄ выполняется параллельно</span>`;
      }

      // Header edit controls (move up/down/delete)
      const hdrControls = document.createElement('div');
      hdrControls.className = 'proc-card-header-controls edit-only';
      hdrControls.style.display = 'none'; // overridden by body.editing CSS

      const btnUp = document.createElement('button');
      btnUp.className = 'ed-btn';
      btnUp.title = 'Переместить вверх';
      btnUp.textContent = '↑';
      btnUp.addEventListener('click', (e) => { e.stopPropagation();
        if (li === 0) return;
        [levels[li-1], levels[li]] = [levels[li], levels[li-1]];
        sl.steps = levelsToSteps(levels);
        saveState(); renderLevels();
      });

      const btnDown = document.createElement('button');
      btnDown.className = 'ed-btn';
      btnDown.title = 'Переместить вниз';
      btnDown.textContent = '↓';
      btnDown.addEventListener('click', (e) => { e.stopPropagation();
        if (li >= levels.length - 1) return;
        [levels[li], levels[li+1]] = [levels[li+1], levels[li]];
        sl.steps = levelsToSteps(levels);
        saveState(); renderLevels();
      });

      const btnDel = document.createElement('button');
      btnDel.className = 'ed-btn danger';
      btnDel.title = 'Удалить шаг';
      btnDel.textContent = '✕';
      btnDel.addEventListener('click', (e) => { e.stopPropagation();
        if (!confirm(`Удалить шаг ${seq}?`)) return;
        levels.splice(li, 1);
        sl.steps = levelsToSteps(levels);
        saveState(); renderLevels();
      });

      // Add parallel task button
      const btnAddTask = document.createElement('button');
      btnAddTask.className = 'ed-btn accent edit-only';
      btnAddTask.title = 'Добавить параллельную задачу';
      btnAddTask.style.display = 'none';
      btnAddTask.textContent = '⊕';
      btnAddTask.addEventListener('click', (e) => { e.stopPropagation();
        level.tasks.push({ deptIndexes: [0], text: 'Новая параллельная задача' });
        sl.steps = levelsToSteps(levels);
        saveState(); renderLevels();
      });

      hdrControls.appendChild(btnUp);
      hdrControls.appendChild(btnDown);
      hdrControls.appendChild(btnAddTask);
      hdrControls.appendChild(btnDel);
      cardHeader.appendChild(hdrControls);
      card.appendChild(cardHeader);

      // Build columns
      if (!isParallel) {
        // Single task
        const col = level.tasks[0];
        const body = document.createElement('div');
        body.className = 'proc-card-body';
        body.style.flexDirection = 'column';

        const primaryRole = sl.roles[col.deptIndexes[0]];
        const primaryColor = roleColorHex(primaryRole || '');
        card.style.borderLeft = `4px solid ${primaryColor}`;

        appendTaskContent(body, col, sl, li, 0, levels, level);
        card.appendChild(body);
      } else {
        const colsWrap = document.createElement('div');
        colsWrap.className = 'proc-cols';

        level.tasks.forEach((col, ci) => {
          const colEl = document.createElement('div');
          colEl.className = 'proc-col';

          // Col delete button
          const colDelBtn = document.createElement('button');
          colDelBtn.className = 'ed-btn danger col-delete-btn edit-only';
          colDelBtn.title = 'Удалить эту задачу';
          colDelBtn.textContent = '✕';
          colDelBtn.style.display = 'none';
          colDelBtn.addEventListener('click', (e) => { e.stopPropagation();
            if (level.tasks.length <= 1) {
              if (!confirm('Удалить последнюю задачу шага (удалит весь шаг)?')) return;
              levels.splice(li, 1);
            } else {
              level.tasks.splice(ci, 1);
            }
            sl.steps = levelsToSteps(levels);
            saveState(); renderLevels();
          });
          colEl.appendChild(colDelBtn);

          appendTaskContent(colEl, col, sl, li, ci, levels, level);
          colsWrap.appendChild(colEl);
        });

        card.appendChild(colsWrap);
      }

      node.appendChild(card);
      flow.appendChild(node);

      // Arrow + add-step between levels
      if (li < levels.length - 1) {
        const arrow = document.createElement('div');
        arrow.className = 'proc-arrow';
        arrow.textContent = '↓';
        flow.appendChild(arrow);
      }
    });

    // Final "add step" button
    const addEnd = document.createElement('button');
    addEnd.className = 'add-step-btn';
    addEnd.innerHTML = '＋ Добавить шаг в конец';
    addEnd.addEventListener('click', () => {
      levels.push({ tasks: [{ deptIndexes: [0], text: 'Новый шаг' }] });
      sl.steps = levelsToSteps(levels);
      saveState();
      renderLevels();
    });
    flow.appendChild(addEnd);
  }

  renderLevels();
  if (returnOnly) { mainContent.appendChild(view); return view; }
  mainContent.appendChild(view);
  return view;
}

// ── Task content: dept badges + text (editable in edit mode) ─────────────────
function appendTaskContent(container, col, sl, li, ci, levels, level) {
  // Dept badges wrapper
  const badgesWrap = document.createElement('div');
  badgesWrap.className = 'proc-dept-badges-wrap';
  badgesWrap.style.marginBottom = '8px';

  function renderBadges() {
    badgesWrap.innerHTML = '';
    // Read-only badges (always visible)
    const badgesRow = document.createElement('div');
    badgesRow.style.display = 'flex';
    badgesRow.style.flexWrap = 'wrap';
    badgesRow.style.gap = '5px';
    col.deptIndexes.forEach(idx => {
      const role = sl.roles[idx];
      if (!role) return;
      const hex = roleColorHex(role);
      const badge = document.createElement('span');
      badge.className = 'proc-dept-badge';
      badge.textContent = role;
      badge.style.background = hex + '22';
      badge.style.color = hex;
      badge.style.border = `1px solid ${hex}55`;
      badgesRow.appendChild(badge);
    });
    badgesWrap.appendChild(badgesRow);

    // Edit-mode dept checkboxes
    const deptEdit = document.createElement('div');
    deptEdit.className = 'dept-select-wrap edit-only';
    deptEdit.style.display = 'none';
    sl.roles.forEach((role, ri) => {
      const label = document.createElement('label');
      label.className = 'dept-checkbox-row';
      const hex = roleColorHex(role);
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = col.deptIndexes.includes(ri);
      cb.addEventListener('change', () => {
        if (cb.checked) {
          if (!col.deptIndexes.includes(ri)) col.deptIndexes.push(ri);
        } else {
          if (col.deptIndexes.length > 1) {
            col.deptIndexes = col.deptIndexes.filter(x => x !== ri);
          } else {
            cb.checked = true; // keep at least one
            return;
          }
        }
        sl.steps = levelsToSteps(levels);
        saveState();
        renderBadges();
      });
      const dot = document.createElement('span');
      dot.style.width = '8px'; dot.style.height = '8px';
      dot.style.borderRadius = '50%'; dot.style.background = hex;
      dot.style.display = 'inline-block'; dot.style.flexShrink = '0';
      label.appendChild(cb);
      label.appendChild(dot);
      label.appendChild(document.createTextNode(role));
      deptEdit.appendChild(label);
    });
    badgesWrap.appendChild(deptEdit);
  }
  renderBadges();
  container.appendChild(badgesWrap);

  // Task text
  const taskText = document.createElement('div');
  taskText.className = 'proc-task-text';
  taskText.innerHTML = escHtml(col.text);

  // Edit textarea (shown on click in edit mode)
  const editArea = document.createElement('textarea');
  editArea.className = 'proc-task-edit';
  editArea.style.display = 'none';
  editArea.value = col.text;

  taskText.addEventListener('click', () => {
    if (!editMode) return;
    taskText.style.display = 'none';
    editArea.style.display = 'block';
    editArea.focus();
    editArea.select();
  });

  editArea.addEventListener('blur', () => {
    const newVal = editArea.value;
    col.text = newVal;
    taskText.innerHTML = escHtml(newVal);
    editArea.style.display = 'none';
    taskText.style.display = 'block';
    sl.steps = levelsToSteps(levels);
    saveState();
  });
  editArea.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      editArea.value = col.text;
      editArea.dispatchEvent(new Event('blur'));
    }
  });

  container.appendChild(taskText);
  container.appendChild(editArea);
}

// ─── STATUS VIEW ──────────────────────────────────────────────────────────────
function buildStatusView(tab, returnOnly) {
  const view = document.createElement('div');
  view.className = 'view' + (tab.id === activeTab && !returnOnly ? ' active' : '');
  view.dataset.id = tab.id;

  const sf = STATE.data.status_flow;

  const legend = document.createElement('div');
  legend.className = 'legend-bar';
  legend.innerHTML = `
    <span class="l-label">Статус:</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span>Работает</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>С отклонениями</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--fail)"></span>Не работает</span>
    <button class="pdf-btn" style="margin-left:auto;" id="pdf-btn-status">⬇ PDF</button>
  `;
  view.appendChild(legend);
  legend.querySelector('#pdf-btn-status').addEventListener('click', () => exportTabToPdf(tab.id));

  const scrollArea = document.createElement('div');
  scrollArea.className = 'status-view';

  const flow = document.createElement('div');
  flow.className = 'status-flow';
  scrollArea.appendChild(flow);

  function renderStatusItems() {
    flow.innerHTML = '';
    sf.items.forEach((item, idx) => {
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'status-node';

      const num = document.createElement('div');
      num.className = `status-node-num ${item.state}`;
      num.textContent = item.num;

      const card = document.createElement('div');
      card.className = `status-node-card ${item.state}`;

      card.innerHTML = `
        <div class="status-node-process">${escHtml(item.process)}</div>
        <div class="status-node-meta">
          <span class="meta-item"><span class="meta-label">Плановый:</span><span class="meta-val">${escHtml(item.planned)}</span></span>
          ${item.actual ? `<span class="meta-item"><span class="meta-label">Фактический:</span><span class="meta-val">${escHtml(item.actual)}</span></span>` : ''}
        </div>
        <div class="status-badge ${item.state}">${escHtml(item.status)}</div>
      `;

      // Edit row
      const editRow = document.createElement('div');
      editRow.className = 'status-edit-row';

      function mkField(label, key, multiline) {
        const wrap = document.createElement('div');
        wrap.className = 'status-edit-field';
        const lbl = document.createElement('label');
        lbl.textContent = label;
        wrap.appendChild(lbl);
        let inp;
        if (multiline) {
          inp = document.createElement('textarea');
          inp.className = 'ed-input';
          inp.style.resize = 'vertical';
          inp.style.minHeight = '56px';
        } else {
          inp = document.createElement('input');
          inp.className = 'ed-input';
          inp.type = 'text';
        }
        inp.value = item[key] || '';
        inp.addEventListener('input', () => {
          item[key] = inp.value;
          saveState();
        });
        inp.addEventListener('change', () => renderStatusItems());
        wrap.appendChild(inp);
        return wrap;
      }

      const stateWrap = document.createElement('div');
      stateWrap.className = 'status-edit-field';
      const stateLbl = document.createElement('label');
      stateLbl.textContent = 'Состояние';
      const stateSelect = document.createElement('select');
      stateSelect.className = 'ed-select';
      [['ok','Работает'],['warn','С отклонениями'],['fail','Не работает']].forEach(([val, lbl]) => {
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = lbl;
        if (item.state === val) opt.selected = true;
        stateSelect.appendChild(opt);
      });
      stateSelect.addEventListener('change', () => {
        item.state = stateSelect.value;
        saveState(); renderStatusItems();
      });
      stateWrap.appendChild(stateLbl);
      stateWrap.appendChild(stateSelect);

      editRow.appendChild(mkField('Процесс', 'process', true));
      editRow.appendChild(mkField('Плановый исполнитель', 'planned', false));
      editRow.appendChild(mkField('Фактический исполнитель', 'actual', false));
      editRow.appendChild(mkField('Статус (описание)', 'status', false));
      editRow.appendChild(stateWrap);

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.className = 'ed-btn danger';
      delBtn.textContent = '✕ Удалить запись';
      delBtn.style.marginTop = '4px';
      delBtn.style.width = 'auto';
      delBtn.style.height = '28px';
      delBtn.style.padding = '0 10px';
      delBtn.style.fontSize = '11px';
      delBtn.addEventListener('click', () => {
        if (!confirm('Удалить эту запись?')) return;
        sf.items.splice(idx, 1);
        saveState(); renderStatusItems();
      });
      editRow.appendChild(delBtn);
      card.appendChild(editRow);

      nodeDiv.appendChild(num);
      nodeDiv.appendChild(card);
      flow.appendChild(nodeDiv);
    });

    // Add row button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn edit-only';
    addBtn.textContent = '＋ Добавить запись';
    addBtn.style.display = 'none';
    addBtn.addEventListener('click', () => {
      sf.items.push({
        num: String(sf.items.length + 1),
        process: 'Новый процесс',
        planned: '',
        actual: '',
        status: 'Работает',
        state: 'ok'
      });
      saveState(); renderStatusItems();
    });
    flow.appendChild(addBtn);
  }

  renderStatusItems();
  view.appendChild(scrollArea);
  if (returnOnly) { mainContent.appendChild(view); return view; }
  mainContent.appendChild(view);
  return view;
}

// ─── DOCUMENTS VIEW ───────────────────────────────────────────────────────────
function buildDocsView(tab, returnOnly) {
  const view = document.createElement('div');
  view.className = 'view' + (tab.id === activeTab && !returnOnly ? ' active' : '');
  view.dataset.id = tab.id;

  const docsToolbar = document.createElement('div');
  docsToolbar.className = 'docs-toolbar';
  docsToolbar.innerHTML = `<span class="l-label">Документы</span>`;
  const docsPdfBtn = document.createElement('button');
  docsPdfBtn.className = 'pdf-btn';
  docsPdfBtn.style.marginLeft = 'auto';
  docsPdfBtn.textContent = '⬇ PDF';
  docsPdfBtn.addEventListener('click', () => exportTabToPdf(tab.id));
  docsToolbar.appendChild(docsPdfBtn);
  view.appendChild(docsToolbar);

  const scrollArea = document.createElement('div');
  scrollArea.className = 'docs-view';

  const docsData = STATE.data.documents;

  function extractTags(name) {
    const tags = [];
    if (name.includes('для ЦУ и РО')) tags.push({ cls:'cu-ro', txt:'ЦУ и РО' });
    else if (name.includes('для РО')) tags.push({ cls:'ro', txt:'для РО' });
    else if (name.includes('для ЦУ')) tags.push({ cls:'cu', txt:'для ЦУ' });
    return tags;
  }
  function cleanName(name) {
    return name.replace(/\s*\(для ЦУ и РО\)|\s*\(для РО\)|\s*\(для ЦУ\)/g,'').trim();
  }

  function renderDocs() {
    scrollArea.innerHTML = '';
    const cuRo = docsData.items.filter(d => d.name.includes('для ЦУ и РО'));
    const roOnly = docsData.items.filter(d => d.name.includes('для РО') && !d.name.includes('для ЦУ и РО'));
    const cuOnly = docsData.items.filter(d => d.name.includes('для ЦУ') && !d.name.includes('для ЦУ и РО'));
    const other = docsData.items.filter(d => !d.name.includes('для ЦУ и РО') && !d.name.includes('для РО') && !d.name.includes('для ЦУ'));

    function renderSection(title, items) {
      if (!items.length) return;
      const t = document.createElement('div');
      t.className = 'docs-section-title';
      t.textContent = title;
      scrollArea.appendChild(t);

      const grid = document.createElement('div');
      grid.className = 'docs-grid';
      items.forEach(doc => {
        const tags = extractTags(doc.name);
        const cleanedName = cleanName(doc.name);
        const card = document.createElement('div');
        card.className = 'doc-card';
        card.style.flexDirection = 'column';

        const topRow = document.createElement('div');
        topRow.style.display = 'flex';
        topRow.style.gap = '12px';
        topRow.style.alignItems = 'flex-start';
        topRow.innerHTML = `
          <div class="doc-num">${doc.num}</div>
          <div>
            <div class="doc-name">${escHtml(cleanedName)}</div>
            ${tags.map(tg=>`<span class="doc-tag ${tg.cls}">${tg.txt}</span>`).join('')}
          </div>
        `;
        card.appendChild(topRow);

        // Edit row
        const editRow = document.createElement('div');
        editRow.className = 'doc-edit-row';

        const nameInp = document.createElement('input');
        nameInp.className = 'ed-input';
        nameInp.type = 'text';
        nameInp.value = doc.name;
        nameInp.style.width = '100%';
        nameInp.placeholder = 'Название документа';
        nameInp.addEventListener('input', () => { doc.name = nameInp.value; saveState(); });
        nameInp.addEventListener('change', () => renderDocs());

        const numInp = document.createElement('input');
        numInp.className = 'ed-input';
        numInp.type = 'text';
        numInp.value = doc.num;
        numInp.style.width = '60px';
        numInp.placeholder = '№';
        numInp.addEventListener('change', () => { doc.num = numInp.value; saveState(); renderDocs(); });

        const delBtn = document.createElement('button');
        delBtn.className = 'ed-btn danger';
        delBtn.textContent = '✕';
        delBtn.title = 'Удалить документ';
        delBtn.addEventListener('click', () => {
          if (!confirm('Удалить документ?')) return;
          const i = docsData.items.indexOf(doc);
          if (i > -1) docsData.items.splice(i, 1);
          saveState(); renderDocs();
        });

        const numRow = document.createElement('div');
        numRow.style.display = 'flex'; numRow.style.gap = '6px'; numRow.style.alignItems = 'center';
        const numLbl = document.createElement('span');
        numLbl.textContent = '№';
        numLbl.style.fontSize = '11px';
        numLbl.style.color = 'var(--text3)';
        numRow.appendChild(numLbl);
        numRow.appendChild(numInp);
        numRow.appendChild(delBtn);

        editRow.appendChild(numRow);
        editRow.appendChild(nameInp);
        card.appendChild(editRow);
        grid.appendChild(card);
      });
      scrollArea.appendChild(grid);
    }

    renderSection('Для ЦУ и РО', cuRo);
    renderSection('Только для РО', roOnly);
    renderSection('Только для ЦУ', cuOnly);
    if (other.length) renderSection('Прочие', other);

    // Add doc button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn edit-only';
    addBtn.textContent = '＋ Добавить документ';
    addBtn.style.display = 'none';
    addBtn.style.maxWidth = '1100px';
    addBtn.style.margin = '8px auto 0';
    addBtn.addEventListener('click', () => {
      docsData.items.push({ num: String(docsData.items.length + 1), name: 'Новый документ' });
      saveState(); renderDocs();
    });
    scrollArea.appendChild(addBtn);
  }

  renderDocs();
  view.appendChild(scrollArea);
  if (returnOnly) { mainContent.appendChild(view); return view; }
  mainContent.appendChild(view);
  return view;
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ─── PDF EXPORT ───────────────────────────────────────────────────────────────
function sanitizeFilename(name) {
  return (name || 'tab').replace(/[\\/:*?"<>|]/g,'_').trim();
}

function showPdfOverlay(text, sub) {
  const ov = document.getElementById('pdf-overlay');
  document.getElementById('pdf-overlay-text').textContent = text || 'Готовлю PDF…';
  document.getElementById('pdf-overlay-sub').textContent = sub || '';
  ov.classList.add('visible');
}
function hidePdfOverlay() {
  document.getElementById('pdf-overlay').classList.remove('visible');
}

async function exportTabToPdf(tabId) {
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    alert('Для экспорта в PDF нужен интернет (загрузка html2canvas/jsPDF)');
    return;
  }

  const tab = TABS.find(t => t.id === tabId);
  if (!tab) return;

  const sl = tab.type === 'swimlane' ? STATE.data.swimlanes.find(s => s.id === tab.slId) : null;
  const label = sl ? sl.title : tab.label;
  const filename = sanitizeFilename(label) + '.pdf';

  showPdfOverlay('Готовлю PDF…', label);

  const targetView = document.querySelector(`.view[data-id="${CSS.escape(tabId)}"]`);
  let prevStyle = null;
  let el = null, prevOverflow = '', prevHeight = '', pdfTitleEl = null;

  try {
    if (!targetView) throw new Error('View not found: ' + tabId);

    // Always render off-screen at a fixed A4-friendly width so the export is
    // identical for single and "all tabs" and never depends on device width.
    const PDF_WIDTH = 1180;
    prevStyle = {
      display: targetView.style.display,
      position: targetView.style.position,
      top: targetView.style.top,
      left: targetView.style.left,
      width: targetView.style.width,
      height: targetView.style.height,
      zIndex: targetView.style.zIndex,
    };
    targetView.style.display = 'flex';
    targetView.style.position = 'fixed';
    targetView.style.top = '-9999px';
    targetView.style.left = '-9999px';
    targetView.style.width = PDF_WIDTH + 'px';
    targetView.style.height = 'auto';
    targetView.style.zIndex = '-1';

    const pdfBgColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--bg2').trim() || '#22233a';

    const selMap = { swimlane: '.proc-flow-scroll', status: '.status-view', docs: '.docs-view' };
    const elSel = selMap[tab.type];
    if (!elSel) throw new Error('Unknown tab type');

    el = targetView.querySelector(elSel);
    if (!el) throw new Error(elSel + ' not found');

    prevOverflow = el.style.overflow;
    prevHeight = el.style.height;
    el.style.overflow = 'visible';
    el.style.height = 'auto';

    // Inject the sheet header at the top so the export shows the process name
    // and (for swimlanes) the «Приложение / приказ» block in the top-right.
    const pdfTitleColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--text').trim() || '#fff';
    pdfTitleEl = document.createElement('div');
    if (sl && STATE.data.orderEnabled) {
      pdfTitleEl.style.cssText = 'position:relative;width:100%;box-sizing:border-box;padding:10px 16px 20px;';
      const appx = document.createElement('div');
      appx.style.cssText = 'position:absolute;top:2px;right:16px;text-align:right;font-size:16px;line-height:1.45;color:' + pdfTitleColor + ';';
      appx.innerHTML = 'Приложение №' + escHtml(String(sl.appendixNo)) +
        '<br>к приказу №' + escHtml(String(sl.decree)) + ' от ' + escHtml(String(sl.date));
      const t = document.createElement('div');
      t.textContent = label;
      t.style.cssText = 'font-size:25px;font-weight:800;text-align:center;color:' + pdfTitleColor + ';padding:0 180px;';
      pdfTitleEl.appendChild(appx);
      pdfTitleEl.appendChild(t);
    } else {
      pdfTitleEl.textContent = label;
      pdfTitleEl.style.cssText = 'font-size:24px;font-weight:800;text-align:center;' +
        'width:100%;box-sizing:border-box;padding:4px 16px 18px;color:' + pdfTitleColor + ';';
    }
    el.insertBefore(pdfTitleEl, el.firstChild);

    await new Promise(r => requestAnimationFrame(r));
    await new Promise(r => requestAnimationFrame(r));

    const SCALE = 2;

    // Measure step/row tops so the PDF never splits one item across pages.
    const nodeSelMap = { swimlane: '.proc-node', status: '.status-node', docs: '.doc-card' };
    const nodeSel = nodeSelMap[tab.type];
    const breakPoints = [];
    if (nodeSel) {
      const elTop = el.getBoundingClientRect().top;
      el.querySelectorAll(nodeSel).forEach(n => {
        const top = Math.round((n.getBoundingClientRect().top - elTop) * SCALE);
        if (top > 0) breakPoints.push(top);
      });
    }

    const sw = Math.max(el.scrollWidth, 900);
    const sh = el.scrollHeight;

    const canvas = await html2canvas(el, {
      backgroundColor: pdfBgColor,
      scale: SCALE,
      useCORS: true,
      width: sw, height: sh,
      windowWidth: sw, windowHeight: sh,
      scrollX: 0, scrollY: 0,
      x: 0, y: 0,
      logging: false
    });

    el.style.overflow = prevOverflow;
    el.style.height = prevHeight;

    buildPdfFromCanvas(canvas, filename, pdfBgColor, breakPoints);

  } catch (err) {
    console.error('PDF export error:', err);
    alert('Ошибка при создании PDF: ' + err.message);
  } finally {
    if (el) { el.style.overflow = prevOverflow; el.style.height = prevHeight; }
    if (pdfTitleEl && pdfTitleEl.parentNode) pdfTitleEl.parentNode.removeChild(pdfTitleEl);
    if (targetView && prevStyle) {
      targetView.style.display = prevStyle.display;
      targetView.style.position = prevStyle.position;
      targetView.style.top = prevStyle.top;
      targetView.style.left = prevStyle.left;
      targetView.style.width = prevStyle.width;
      targetView.style.height = prevStyle.height;
      targetView.style.zIndex = prevStyle.zIndex;
    }
    hidePdfOverlay();
  }
}

function buildPdfFromCanvas(canvas, filename, bgColor, breakPoints) {
  const { jsPDF } = window.jspdf;
  const imgW = canvas.width;
  const imgH = canvas.height;

  // Wide content → landscape A4, tall content → portrait A4.
  const orientation = imgW > imgH * 1.25 ? 'l' : 'p';
  const pdf = new jsPDF({ orientation, unit: 'mm', format: 'a4', compress: true });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 8;
  const contentW = pageW - margin * 2;
  const contentH = pageH - margin * 2;

  // Scale so the image width fills the printable A4 width.
  const ratio = contentW / imgW;       // mm per source px
  const fullScaledH = imgH * ratio;    // mm height of the whole image

  if (fullScaledH <= contentH + 0.5) {
    // Fits on one A4 page — center vertically.
    const offY = margin + (contentH - fullScaledH) / 2;
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, offY, contentW, fullScaledH);
  } else {
    // Paginate: slice the source canvas into A4-page-height chunks. Snap each
    // page's bottom edge to a step/row boundary so no item is split in two.
    const pagePxH = Math.floor(contentH / ratio); // max source px per A4 page
    const bps = (breakPoints || []).slice().sort((a, b) => a - b);
    let y = 0, page = 0;
    while (y < imgH) {
      const targetEnd = y + pagePxH;
      let sliceEnd;
      if (targetEnd >= imgH) {
        sliceEnd = imgH;
      } else {
        let snap = -1;
        for (const bp of bps) {
          if (bp > y + 4 && bp <= targetEnd && bp > snap) snap = bp;
        }
        sliceEnd = (snap > y + pagePxH * 0.15) ? snap : targetEnd;
      }
      const sliceH = Math.max(1, Math.round(sliceEnd - y));
      const tmp = document.createElement('canvas');
      tmp.width = imgW;
      tmp.height = sliceH;
      const ctx = tmp.getContext('2d');
      if (bgColor) { ctx.fillStyle = bgColor; ctx.fillRect(0, 0, imgW, sliceH); }
      ctx.drawImage(canvas, 0, y, imgW, sliceH, 0, 0, imgW, sliceH);
      const sliceMmH = sliceH * ratio;
      if (page > 0) pdf.addPage();
      pdf.addImage(tmp.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, contentW, sliceMmH);
      y = sliceEnd;
      page++;
    }
  }
  pdf.save(filename);
}

async function exportAllTabs() {
  for (let i = 0; i < TABS.length; i++) {
    const tab = TABS[i];
    const sl = tab.type === 'swimlane' ? STATE.data.swimlanes.find(s => s.id === tab.slId) : null;
    const label = sl ? sl.title : tab.label;
    showPdfOverlay(`Экспорт ${i+1}/${TABS.length}…`, label);
    await exportTabToPdf(tab.id);
    await new Promise(r => setTimeout(r, 300));
  }
  hidePdfOverlay();
}

// ─── JSON EXPORT/IMPORT/RESET ─────────────────────────────────────────────────
document.getElementById('exportAllBtn').addEventListener('click', exportAllTabs);

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(STATE.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vsks_processes.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('importJsonInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || !parsed.swimlanes) {
        alert('Неверный формат JSON: нет поля swimlanes');
        return;
      }
      STATE.data = migrateData(parsed);
      saveState();
      renderAll();
      applyOrderEnabled(STATE.data.orderEnabled);
    } catch(err) {
      alert('Ошибка чтения JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  this.value = '';
});

document.getElementById('resetDataBtn').addEventListener('click', () => {
  if (!confirm('Сбросить все данные к исходным? Все правки будут потеряны.')) return;
  STATE.data = migrateData(deepCopy(DATA));
  localStorage.removeItem(STATE_KEY);
  renderAll();
  applyOrderEnabled(STATE.data.orderEnabled);
});

// ─── EDIT MODE TOGGLE ─────────────────────────────────────────────────────────
document.getElementById('editModeBtn').addEventListener('click', () => {
  editMode = !editMode;
  document.body.classList.toggle('editing', editMode);
  const btn = document.getElementById('editModeBtn');
  btn.querySelector('.btn-label-long').textContent = editMode ? 'Выйти из правки' : 'Режим правки';
  // Show/hide edit-only elements
  document.querySelectorAll('.edit-only').forEach(el => {
    el.style.display = editMode ? 'flex' : 'none';
  });
  document.querySelectorAll('.edit-only-inline').forEach(el => {
    el.style.display = editMode ? 'inline-flex' : 'none';
  });
});

// ─── ORDER (Приложение к приказу) TOGGLE ──────────────────────────────────────
const orderToggle = document.getElementById('orderToggle');
function applyOrderEnabled(on) {
  STATE.data.orderEnabled = !!on;
  document.body.classList.toggle('order-on', !!on);
  if (orderToggle) orderToggle.checked = !!on;
}
applyOrderEnabled(STATE.data.orderEnabled);
if (orderToggle) {
  orderToggle.addEventListener('change', () => {
    applyOrderEnabled(orderToggle.checked);
    saveState();
  });
}

// ─── THEME TOGGLE ─────────────────────────────────────────────────────────────
const THEME_KEY = 'vsks_theme';

function getCurrentTheme() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  updateThemeBtn(theme);
}

function updateThemeBtn(theme) {
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  if (theme === 'light') {
    btn.textContent = '🌙 Тёмная тема';
    btn.title = 'Переключить на тёмную тему';
  } else {
    btn.textContent = '☀ Светлая тема';
    btn.title = 'Переключить на светлую тему';
  }
}

document.getElementById('themeToggleBtn').addEventListener('click', function() {
  applyTheme(getCurrentTheme() === 'light' ? 'dark' : 'light');
});

updateThemeBtn(getCurrentTheme());

// ─── INITIAL RENDER ───────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>

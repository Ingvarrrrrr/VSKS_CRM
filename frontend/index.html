    <!-- Phase 26-FFF: one-time SW + cache cleanup для пользователей со старым bundle.
         Срабатывает максимум 1 раз (флаг в localStorage). Помогает тем кто впервые
         получил свежий index.html (после убирания html из precache в vite.config). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('phase29_3_R3_2026_05_26') === '1') return;
          if (!('serviceWorker' in navigator) || !('caches' in window)) {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            return;
          }
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }),
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          ]).then(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
            window.location.reload();
          }).catch(function () {
            localStorage.setItem('phase29_3_R3_2026_05_26', '1');
          });
        } catch (e) {
          try { localStorage.setItem('phase29_3_R3_2026_05_26', '1'); } catch (_) { /* noop */ }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

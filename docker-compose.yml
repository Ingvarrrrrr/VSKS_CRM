version: '3.8'

# Явное имя проекта: раньше не задавалось (compose брал его из basename
# рабочего каталога — на проде это `/opt/vsks-crm` → и так уже "vsks-crm").
# Зафиксировано явно с разрезом edge/GALA (2026-09-05): deploy/edge/
# docker-compose.yml подключается к сети ЭТОГО проекта по ИМЕНИ
# `vsks-crm_default` (external: true) — если бы имя проекта неявно зависело
# от имени каталога, переименование/перенос каталога на сервере молча
# сломало бы edge (сеть с ожидаемым именем перестала бы существовать).
name: vsks-crm

# ──────────────────────────────────────────────────────────────────────────
# Phase «бесшовный деплой» (2026-09-04): backend и frontend раньше были
# ОДНИМ контейнером каждый. `docker compose up -d backend` при деплое
# останавливал единственную реплику, пока новая поднималась (миграции +
# инициализация — десятки секунд) — все запросы получали 502. Теперь у
# каждого по ДВЕ реплики (_a/_b) за общим DNS-именем сервиса не работает
# (nginx у нас резолвит по прямому имени контейнера, см. nginx/nginx.conf
# upstream backend_pool/frontend_pool) — autodeploy.sh перезапускает их
# ПООЧЕРЁДНО: пока одна реплика пересоздаётся, вторая продолжает отвечать,
# а nginx (proxy_next_upstream) уводит запросы с недоступной реплики на
# живую. Оба сервиса в паре используют ОДИН собранный образ (одинаковый
# `image:`, но `build:` есть только у _a — иначе `docker compose build`
# собирал бы дважды): autodeploy.sh собирает только *_a, *_b просто
# использует уже готовый локальный тег.
# ──────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  image: vsks-crm-backend:latest
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vsks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vsks_crm}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    SUBSIDY_LIMIT: "26128070"
    SMTP_HOST: smtp.yandex.ru
    SMTP_PORT: "587"
    SMTP_USER: z@vsks.ru
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
    SMTP_FROM: z@vsks.ru
    # Захардкожено: на хосте .env держит устаревший http://85.239.53.155 и
    # перебивал бы ${BASE_URL:-...}; ссылки в письмах должны вести на домен.
    BASE_URL: https://gaaala.duckdns.org
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    PROVERKACHEKA_TOKEN: ${PROVERKACHEKA_TOKEN:-}
    FABRIKANT_LOGIN: ${FABRIKANT_LOGIN:-}
    FABRIKANT_PASSWORD: ${FABRIKANT_PASSWORD:-}
    PLATFORM_CRED_KEY: ${PLATFORM_CRED_KEY:-}
  # backend доступен через nginx по http://localhost/api/ — наружу не открываем
  volumes:
    - uploads:/app/uploads
    - ./backend/app:/app/app
    - ./backend/templates:/app/templates
    - ./backend/check_schema.py:/app/check_schema.py
    - ./backend/seed_data:/app/seed_data:ro
  # Реальная готовность, а не факт запуска процесса: GET /docs у FastAPI
  # отвечает 200 ТОЛЬКО когда ASGI-приложение полностью поднято (lifespan
  # startup завершён) — а до этого момента процесс уже пережил `migrate.py &&
  # init_db.py` (см. backend/Dockerfile CMD), т.е. миграции к этому моменту
  # уже применены. Не заводили отдельный /api/health, чтобы не трогать
  # backend/app/** без необходимости — /docs встроен во FastAPI из коробки.
  #
  # start_period/retries подобраны ПОД ХОЛОДНЫЙ СТАРТ, не только под рутинный
  # rolling-редеплой: при `docker compose down && up -d` backend_a стартует
  # ОДНОВРЕМЕННО с db/frontend/nginx/n8n/adminer — на нагруженной машине
  # (замечено эмпирически на локальном стенде 2026-09-04: миграции+init_db
  # заняли ~35с вместо обычных 10-15с) реальная готовность может занять
  # заметно дольше, чем при точечном rolling-редеплое одной реплики. Старое
  # значение (start_period 10s, retries 5×3s = 25s общего окна) в этом
  # сценарии проехало мимо: Docker пометил контейнер unhealthy ДО того, как
  # он реально ожил, и `depends_on: condition: service_healthy` у backend_b
  # (см. ниже) НАВСЕГДА оборвал холодный старт ("dependency failed to
  # start: ... is unhealthy" — compose не переспрашивает после unhealthy).
  # 75s общего окна (15s+20×3s) — с большим запасом под пиковую нагрузку.
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:8000/docs', timeout=2).getcode()==200 else 1)"]
    interval: 3s
    timeout: 2s
    retries: 20
    start_period: 15s

x-frontend-common: &frontend-common
  image: vsks-crm-frontend:latest
  # server.mjs всегда отдаёт 200 на "/" (index.html, в т.ч. SPA-фолбэк) —
  # значит node-процесс поднят и реально слушает порт.
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://localhost:3080/', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
    interval: 3s
    timeout: 2s
    retries: 5
    start_period: 5s

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vsks_crm
      POSTGRES_USER: vsks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsks -d vsks_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend_a:
    <<: *backend-common
    build: ./backend
    depends_on:
      db:
        condition: service_healthy

  backend_b:
    <<: *backend-common
    # НЕ строит образ (использует тот же тег, что уже собрал backend_a) и
    # ждёт, пока backend_a реально поднимется (healthy), ПРЕЖДЕ чем стартовать
    # сам. Это гарантирует отсутствие параллельных миграций не только во
    # время rolling-деплоя (autodeploy.sh обновляет реплики строго по одной),
    # но и на холодном `docker compose up` с нуля — backend_b просто не
    # запустит свой `migrate.py`, пока alembic не завершится у backend_a.
    depends_on:
      db:
        condition: service_healthy
      backend_a:
        condition: service_healthy

  frontend_a:
    <<: *frontend-common
    build: ./frontend
    depends_on:
      - backend_a
      - backend_b

  frontend_b:
    <<: *frontend-common
    depends_on:
      - backend_a
      - backend_b

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}
      # Наружу n8n доступен только через nginx по HTTPS на /n8n/.
      # С localhost он генерировал внешние вебхуки с адресом localhost.
      - N8N_HOST=gaaala.duckdns.org
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://gaaala.duckdns.org/n8n/
      - GENERIC_TIMEZONE=Europe/Moscow
      - N8N_DEFAULT_USER_EMAIL=admin@vsks.local
      - N8N_DEFAULT_USER_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}
    ports:
      # Только на loopback: наружу n8n ходит через nginx /n8n/, а внутри
      # docker-сети nginx обращается по http://n8n:5678. Публикация на
      # 0.0.0.0 — это HIGH-5 из аудита 2026-07-25; сейчас её режет
      # серверный файрвол, но он живёт вне git и однажды может не примениться.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend_a

  nginx:
    image: nginx:alpine
    environment:
      # Basic-auth для adminer.gaaala.duckdns.org. НЕ бинд-маунт: абсолютный
      # хостовый путь ломал бы любую другую машину (docker создал бы там
      # каталог вместо файла, если его нет). entrypoint.sh собирает из этой
      # переменной /etc/nginx/secrets/adminer.htpasswd при старте контейнера;
      # если переменная пуста — пишет заведомо неподходящий хеш, так что
      # adminer честно отдаёт 401, а не 500. Значение — целая строка
      # htpasswd (`user:hash`), см. .env.example.
      ADMINER_HTPASSWD: ${ADMINER_HTPASSWD:-}
    ports:
      # Phase «разрез edge/GALA» (2026-09-05): раньше этот контейнер держал
      # 80/443 для ВСЕХ доменов сервера. Теперь 80/443 держит отдельный
      # edge-nginx (deploy/edge/, вне git-дерева, устанавливается на сервер
      # install.sh в /opt/edge-nginx/ — autodeploy.sh VSKS его не трогает
      # никогда). Этот контейнер — только GALA, только на loopback, TLS
      # снят (см. nginx/nginx.conf) — наружу порт 8079 не публикуется,
      # правило №4 (наружу только 80/443) соблюдено структурно: даже если
      # firewall когда-нибудь не применится, порт всё равно недоступен
      # ни с одного другого адреса, кроме localhost этой же машины.
      - "127.0.0.1:8079:80"
    volumes:
      # ⚠️ КАТАЛОГ, НЕ ФАЙЛ (инцидент на проде 2026-09-04, 10 минут простоя).
      # Раньше монтировался ОДИНОЧНЫЙ файл (`./nginx/nginx.conf:/etc/nginx/
      # nginx.conf`). Bind-mount одиночного файла в Docker/Linux привязывается
      # к КОНКРЕТНОМУ inode на момент старта контейнера — это mount самого
      # файла, а не «результат обращения по этому пути». `git checkout -f` +
      # `git pull` не правят файл на месте: git пишет во временный файл и
      # переименовывает его поверх старого — это НОВЫЙ inode на том же пути.
      # У УЖЕ ЗАПУЩЕННОГО контейнера примонтирован СТАРЫЙ inode — он продолжает
      # видеть старое содержимое НАВСЕГДА, пока контейнер не пересоздан.
      # Раньше это маскировалось тем, что при изменении nginx.conf скрипт делал
      # `--force-recreate nginx` — пересоздание заново устанавливало bind-mount
      # против актуального на тот момент файла. Когда recreate заменили на
      # graceful `nginx -t && nginx -s reload` (чтобы не ронять чужие домены на
      # секунды пересоздания), эта маскировка исчезла: `nginx -t` внутри
      # контейнера проверял СТАРЫЙ (валидный!) конфиг, reload перезагружал
      # СТАРЫЙ конфиг, деплой честно писал "config valid, reload выполнен" —
      # и всё это было ПРАВДОЙ ровно для того файла, который контейнер видел,
      # просто это была не та правда, которая нужна.
      #
      # Bind-mount КАТАЛОГА эту проблему устраняет структурно: примонтирован
      # inode самого каталога ./nginx (он не меняется, когда файл ВНУТРИ него
      # переименовывают/заменяют — переименование правит запись в каталоге,
      # а не сам каталог). Поиск "nginx.conf" внутри примонтированного
      # каталога — это ВСЕГДА свежее разрешение имени, а не однократно
      # закэшированный inode. autodeploy.sh (nginx_reload_if_valid) держит
      # ДОПОЛНИТЕЛЬНО sha256-сверку хост/контейнер перед каждым reload — как
      # независимая защита на случай, если когда-нибудь монтирование снова
      # станет файловым или проявится иная причина расхождения.
      - ./nginx:/etc/nginx-src:ro
      - /etc/letsencrypt:/etc/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend_a
      - backend_b
      - frontend_a
      - frontend_b
    # entrypoint.sh создаёт self-signed placeholder если LE-сертификата нет
    # и собирает adminer.htpasswd из ADMINER_HTPASSWD — чтобы nginx стартовал.
    # Реальный cert заменит placeholder после setup-ssl.sh.
    #
    # Раньше запускался через официальный механизм /docker-entrypoint.d/
    # (специальный путь монтирования, который entrypoint-обвязка образа
    # nginx:alpine подхватывает САМА). Теперь весь ./nginx смонтирован единым
    # каталогом на /etc/nginx-src — entrypoint.sh лежит там же и вызывается
    # явно, по тому же пути. `nginx -c /etc/nginx-src/nginx.conf` — конфиг
    # ЯВНО задан флагом (не полагаемся на дефолтный /etc/nginx/nginx.conf,
    # которого здесь больше нет) — это тот же файл, что тестирует и
    # перезагружает autodeploy.sh (`nginx -t -c /etc/nginx-src/nginx.conf`),
    # см. комментарий в volumes выше. `-s reload` без `-c` — это штатно:
    # nginx находит уже запущенный master-процесс по pid-файлу (путь к нему
    # не зависит от `-c`) и просит ЕГО перечитать СВОЙ, уже известный ему,
    # путь конфига — тот же `/etc/nginx-src/nginx.conf`, с которым master
    # был изначально запущен.
    #
    # Затем nginx перечитывает конфиг каждые 6 часов — исторический артефакт
    # подхвата обновлённых сертификатов после certbot renew; с разрезом
    # edge/GALA (2026-09-05, см. deploy/edge/) этот контейнер сертификатов
    # больше не касается (TLS терминирует edge, deploy/edge/nginx.conf,
    # который сам держит СВОЙ 6-часовой reload-цикл для той же цели) — цикл
    # здесь оставлен НЕТРОНУТЫМ (минимальный диф после инцидента 2026-09-04):
    # он просто перечитывает уже валидный конфиг раз в 6 часов, никакого
    # вреда. autodeploy.sh вызывает `nginx -t && nginx -s reload` (graceful)
    # после каждой обновлённой реплики backend/frontend — ЭТОТ контейнер
    # autodeploy.sh по-прежнему НИКОГДА не пересоздаёт рутинно (только
    # `nginx -t` + graceful `-s reload`), хотя теперь он отвечает ТОЛЬКО за
    # GALA (127.0.0.1:8079, не 80/443, не чужие домены) — пересоздание стало
    # безопаснее, чем было, но привычка «не трогать nginx походя» сохранена
    # как более консервативная. Пересоздание остаётся ТОЛЬКО как
    # автоматический fallback при обнаруженном расхождении sha256
    # хост/контейнер — см. nginx_reload_if_valid в autodeploy.sh — и только
    # после независимой проверки НОВОГО файла.
    command: >
      sh -c "/etc/nginx-src/entrypoint.sh && (while :; do sleep 6h & wait $${!}; nginx -s reload; done &) ; nginx -c /etc/nginx-src/nginx.conf -g 'daemon off;'"

  # Certbot с DNS-01 challenge через DuckDNS. Первый запуск — вручную через
  # `docker compose run --rm certbot certonly ...` (см. scripts/setup-ssl.sh).
  # Дальше контейнер крутится в фоне и каждые 12 часов вызывает renew.
  certbot:
    image: infinityofspace/certbot_dns_duckdns:latest
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --quiet --deploy-hook 'echo renewed-at-$$(date -Iseconds)'; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # Phase 30-xx: Adminer — только для внутренней docker-сети (vsks-crm_default),
  # наружу не публикуется портом. Доступ исключительно через nginx-прокси
  # adminer.gaaala.duckdns.org с basic-auth (см. блок nginx выше и nginx.conf).
  # Видит по имени сервисов только базы этого compose-проекта (db); для
  # администрирования БД других проектов (sunduk/sizo/nemakh) их сети сюда
  # не подключены — сознательно, чтобы не трогать чужую инфраструктуру.
  adminer:
    image: adminer:latest
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
  uploads:
